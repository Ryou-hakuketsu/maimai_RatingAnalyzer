<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>maimai DX Rating 對照與計算器</title>
    <style>
        :root {
            --primary: #4a90e2;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #d1d5db;
            --header-bg: #357abd;

            /* Excel 條件式變色顏色 */
            --color-gt: #92D050; /* 大於底分 (綠) */
            --color-eq: #FFC000; /* 等於底分 (黃) */
            --color-lt: #FF5050; /* 小於底分 (紅) */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
        }

        .calculator-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            align-items: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #666;
        }

        .input-group input {
            padding: 10px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            transition: border 0.2s;
        }

        .input-group input:focus {
            border-color: var(--primary);
        }

        .result-box {
            background: #eef5fc;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #cce0f5;
        }

        .result-box .val {
            font-size: 28px;
            font-weight: bold;
            color: var(--header-bg);
        }

        .table-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
            background: #f8fafc;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .table-controls .control-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .table-controls input {
            padding: 6px 10px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        .legend {
            display: flex;
            gap: 10px;
            margin-left: auto;
            font-size: 13px;
            font-weight: bold;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-box {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            text-align: center;
            background: white;
        }

        th, td {
            padding: 8px 6px;
            border: 1px solid var(--border-color);
            vertical-align: middle;
            text-align: center;
        }

        th {
            background-color: var(--header-bg);
            color: white;
            font-weight: 600;
            white-space: nowrap;
        }

        .rank-cell {
            font-weight: bold;
            background-color: #f8fafc;
        }

        /* 計算出來的 Rating 數據字體加粗 */
        .rating-val {
            font-weight: bold;
            font-size: 15px;
        }

        /* 條件式變色 CSS 類別 */
        .cell-gt {
            background-color: var(--color-gt) !important;
            color: #000;
        }
        .cell-eq {
            background-color: var(--color-eq) !important;
            color: #000;
        }
        .cell-lt {
            background-color: var(--color-lt) !important;
            color: #fff;
        }

        @media (max-width: 768px) {
            body { padding: 10px; }
            th, td { padding: 6px 4px; font-size: 12px; }
            .legend { margin-left: 0; width: 100%; justify-content: flex-start; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎶 maimai DX Rating 計算與對照表</h1>

    <!-- 計算器卡片 -->
    <div class="card">
        <h3>⚡ 單曲 Rating 即時計算</h3>
        <div class="calculator-grid">
            <div class="input-group">
                <label for="calc-lv">譜面定數 (Lv)</label>
                <input type="number" id="calc-lv" step="0.1" value="14.0" min="1" max="15.0">
            </div>
            <div class="input-group">
                <label for="calc-achieve">達成率 (%)</label>
                <input type="number" id="calc-achieve" step="0.0001" value="100.5000" min="0" max="101.0000">
            </div>
            <div class="result-box">
                <div style="font-size:12px; color:#666;">獲得 Rating</div>
                <div class="val" id="calc-result">315</div>
                <div style="font-size:12px; color:#888;" id="calc-rank">Rank: SSS+</div>
            </div>
        </div>
    </div>

    <!-- 對照表卡片 -->
    <div class="card">
        <div class="table-controls">
            <div class="control-item">
                <label for="base-lv"><b>基底等級 (Lv)：</b></label>
                <!-- 限制只能輸入整數，且最多兩位數 (1~99) -->
                <input type="number" id="base-lv" step="1" min="1" max="99" maxlength="2" value="14" 
                       onkeydown="return event.key !== '.' && event.key !== 'e' && event.key !== 'E' && event.key !== '-'"
                       oninput="if(this.value.length > 2) this.value = this.value.slice(0, 2);"
                       style="width: 70px;">
            </div>

            <div class="control-item">
                <label for="target-score"><b>底分 (目標 Rating)：</b></label>
                <input type="number" id="target-score" step="1" value="294" style="width: 90px;">
            </div>

            <!-- 圖例說明 -->
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-box" style="background: var(--color-gt);"></div>
                    <span>&gt; 底分</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box" style="background: var(--color-eq);"></div>
                    <span>= 底分</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box" style="background: var(--color-lt);"></div>
                    <span>&lt; 底分</span>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table id="rating-table">
                <thead>
                    <tr id="header-row-1">
                        <th rowspan="2">Rank</th>
                        <th rowspan="2">ボーダー<br>達成率</th>
                        <!-- 動態插入 Lv. 跨欄 -->
                        <th colspan="11">Lv.</th>
                        <th rowspan="2">ボーダー<br>達成率</th>
                        <th rowspan="2">評価<br>係数</th>
                    </tr>
                    <tr id="header-row-2">
                        <!-- 動態插入具體 Lv 數值 -->
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- 動態生成數據 -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // 評級數據與門檻對照表
    const ratingRules = [
        { rank: 'SSS+', border: 1.005,    coeff: 22.4, rowspan: 1 },
        { rank: 'SSS',  border: 1.004999, coeff: 22.2, rowspan: 2 },
        { rank: null,   border: 1.000000, coeff: 21.6, rowspan: 0 },
        { rank: 'SS+',  border: 0.999999, coeff: 21.4, rowspan: 2 },
        { rank: null,   border: 0.995000, coeff: 21.1, rowspan: 0 },
        { rank: 'SS',   border: 0.990000, coeff: 20.8, rowspan: 1 },
        { rank: 'S+',   border: 0.989999, coeff: 20.6, rowspan: 2 },
        { rank: null,   border: 0.980000, coeff: 20.3, rowspan: 0 },
        { rank: 'S',    border: 0.970000, coeff: 20.0, rowspan: 1 },
        { rank: 'AAA',  border: 0.969999, coeff: 17.6, rowspan: 2 },
        { rank: null,   border: 0.940000, coeff: 16.8, rowspan: 0 },
        { rank: 'AA',   border: 0.939999, coeff: 16.0, rowspan: 2 },
        { rank: null,   border: 0.900000, coeff: 15.2, rowspan: 0 },
        { rank: 'A',    border: 0.899999, coeff: 14.4, rowspan: 2 },
        { rank: null,   border: 0.800000, coeff: 13.6, rowspan: 0 },
        { rank: 'BBB',  border: 0.750000, coeff: 12.0, rowspan: 1 },
        { rank: 'BB',   border: 0.700000, coeff: 11.2, rowspan: 1 },
        { rank: 'B',    border: 0.600000, coeff: 9.6,  rowspan: 1 },
        { rank: 'C',    border: 0.500000, coeff: 8.0,  rowspan: 1 }
    ];

    // 格式化百分比
    function formatPercentage(value) {
        return (value * 100).toFixed(4) + '%';
    }

    // 計算 Rating 核心邏輯
    function calculateRating(lv, achieveRatio) {
        let matchedRule = ratingRules[ratingRules.length - 1];
        for (let rule of ratingRules) {
            if (achieveRatio >= rule.border) {
                matchedRule = rule;
                break;
            }
        }
        const rating = Math.round(lv * matchedRule.coeff * matchedRule.border);
        
        let rankText = matchedRule.rank;
        if (!rankText) {
            for (let rule of ratingRules) {
                if (achieveRatio >= rule.border && rule.rank) {
                    rankText = rule.rank;
                    break;
                }
            }
        }
        return { rating, rank: rankText || 'D' };
    }

    // 更新計算器面板
    function updateCalculator() {
        const lv = parseFloat(document.getElementById('calc-lv').value) || 0;
        const achieve = parseFloat(document.getElementById('calc-achieve').value) || 0;
        const ratio = achieve / 100.0;

        const result = calculateRating(lv, ratio);
        document.getElementById('calc-result').innerText = result.rating;
        document.getElementById('calc-rank').innerText = `Rank: ${result.rank}`;
    }

    // 渲染動態對照表
    function renderTable() {
        const baseLvInput = document.getElementById('base-lv');
        
        // 限制長度最大為 2 位數
        if (baseLvInput.value.length > 2) {
            baseLvInput.value = baseLvInput.value.slice(0, 2);
        }

        let baseLv = parseInt(baseLvInput.value, 10);
        if (isNaN(baseLv)) {
            baseLv = 14;
        } else {
            baseLvInput.value = baseLv;
        }
        
        const targetScore = parseInt(document.getElementById('target-score').value, 10);

        const headerRow2 = document.getElementById('header-row-2');
        const tbody = document.getElementById('table-body');

        // 生成 11 個等級 (整數 baseLv ~ baseLv + 1.0)
        const levels = [];
        for (let i = 0; i < 11; i++) {
            levels.push(Math.round((baseLv + i * 0.1) * 10) / 10);
        }

        // 渲染表頭 Lv
        headerRow2.innerHTML = levels.map(l => `<th>${l.toFixed(1)}</th>`).join('');

        // 渲染表身數據
        tbody.innerHTML = ratingRules.map(rule => {
            const cells = levels.map(lv => {
                const r = Math.round(lv * rule.coeff * rule.border);
                
                // 根據底分判斷變色 class
                let colorClass = '';
                if (!isNaN(targetScore)) {
                    if (r > targetScore) {
                        colorClass = 'cell-gt';
                    } else if (r === targetScore) {
                        colorClass = 'cell-eq';
                    } else {
                        colorClass = 'cell-lt';
                    }
                }

                return `<td class="rating-val ${colorClass}">${r}</td>`;
            }).join('');

            // 判斷 Rank 跨欄 (rowspan)
            let rankTd = '';
            if (rule.rowspan > 0) {
                rankTd = `<td rowspan="${rule.rowspan}" class="rank-cell">${rule.rank}</td>`;
            }

            const pctDisplay = formatPercentage(rule.border);

            return `
                <tr>
                    ${rankTd}
                    <td>${pctDisplay}</td>
                    ${cells}
                    <td>${pctDisplay}</td>
                    <td>${rule.coeff}</td>
                </tr>
            `;
        }).join('');
    }

    // 事件監聽
    document.getElementById('calc-lv').addEventListener('input', updateCalculator);
    document.getElementById('calc-achieve').addEventListener('input', updateCalculator);
    
    // 基底等級變更時處理
    const baseLvEl = document.getElementById('base-lv');
    baseLvEl.addEventListener('input', () => {
        renderTable();
        updateCalculator();
    });
    baseLvEl.addEventListener('change', () => {
        renderTable();
        updateCalculator();
    });

    document.getElementById('target-score').addEventListener('input', renderTable);

    // 初始化
    renderTable();
    updateCalculator();
</script>

</body>
</html>
