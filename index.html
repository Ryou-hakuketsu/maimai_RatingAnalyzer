<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>maimai DX Rating 對照與計算器</title>
    <style>
        :root {
            --primary: #4a90e2;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #d1d5db;
            --header-bg: #357abd;

            /* Excel 條件式變色顏色 */
            --color-gt: #92D050; /* 大於底分 (綠) */
            --color-eq: #FFC000; /* 等於底分 (黃) */
            --color-lt: #FF5050; /* 小於底分 (紅) */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
        }

        .calculator-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            align-items: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #666;
        }

        .input-group input {
            padding: 10px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            transition: border 0.2s;
        }

        .input-group input:focus {
            border-color: var(--primary);
        }

        .result-box {
            background: #eef5fc;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #cce0f5;
        }

        .result-box .val {
            font-size: 28px;
            font-weight: bold;
            color: var(--header-bg);
        }

        .table-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
            background: #f8fafc;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .table-controls .control-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .table-controls input {
            padding: 6px 10px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        /* 偽裝成輸入框的按鈕（不會召喚手機鍵盤） */
        .select-trigger {
            padding: 6px 12px;
            font-size: 15px;
            font-weight: bold;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #ffffff;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            min-width: 70px;
            text-align: center;
            user-select: none;
            color: var(--text-color);
        }

        .select-trigger:after {
            content: '▼';
            font-size: 10px;
            margin-left: 8px;
            color: #666;
        }

        /* 跳出式 Modal 蒙版 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* 跳出式視窗內容 */
        .modal-content {
            background: white;
            border-radius: 12px;
            width: 85%;
            max-width: 320px;
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
            animation: modalUp 0.2s ease-out;
        }

        @keyframes modalUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            padding: 15px;
            background: var(--header-bg);
            color: white;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
        }

        .modal-body {
            overflow-y: auto;
            max-height: 50vh;
            padding: 5px 0;
            -webkit-overflow-scrolling: touch;
        }

        .modal-option {
            padding: 12px;
            text-align: center;
            font-size: 16px;
            font-weight: 500;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.15s;
        }

        .modal-option:last-child {
            border-bottom: none;
        }

        .modal-option:active {
            background-color: #eef5fc;
            color: var(--primary);
            font-weight: bold;
        }

        .modal-cancel {
            padding: 12px;
            text-align: center;
            background: #f8fafc;
            color: #666;
            font-weight: bold;
            border-top: 1px solid var(--border-color);
            cursor: pointer;
        }

        .legend {
            display: flex;
            gap: 10px;
            margin-left: auto;
            font-size: 13px;
            font-weight: bold;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-box {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            text-align: center;
            background: white;
        }

        th, td {
            padding: 8px 6px;
            border: 1px solid var(--border-color);
            vertical-align: middle;
            text-align: center;
            position: relative;
        }

        th {
            background-color: var(--header-bg);
            color: white;
            font-weight: 600;
            white-space: nowrap;
        }

        .rank-cell {
            font-weight: bold;
            background-color: #f8fafc;
        }

        .rating-val {
            font-weight: bold;
            font-size: 15px;
        }

        /* 條件式變色 CSS 類別 */
        .cell-gt {
            background-color: var(--color-gt) !important;
            color: #000;
        }
        .cell-eq {
            background-color: var(--color-eq) !important;
            color: #000;
        }
        .cell-lt {
            background-color: var(--color-lt) !important;
            color: #fff;
        }

        /* 雙層高對比醒目框選樣式 */
        td.hl-cell {
            border-top: 3px solid #1d4ed8 !important;
            border-bottom: 3px solid #1d4ed8 !important;
            box-shadow: inset 0 2px 0 #ffffff, inset 0 -2px 0 #ffffff;
            z-index: 10;
        }
        td.hl-cell-first {
            border-left: 3px solid #1d4ed8 !important;
            box-shadow: inset 2px 0 0 #ffffff, inset 0 2px 0 #ffffff, inset 0 -2px 0 #ffffff;
        }
        td.hl-cell-last {
            border-right: 3px solid #1d4ed8 !important;
            box-shadow: inset -2px 0 0 #ffffff, inset 0 2px 0 #ffffff, inset 0 -2px 0 #ffffff;
        }

        @media (max-width: 768px) {
            body { padding: 10px; }
            th, td { padding: 6px 4px; font-size: 12px; }
            .legend { margin-left: 0; width: 100%; justify-content: flex-start; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎶 maimai DX Rating 計算與對照表</h1>

    <!-- 計算器卡片 -->
    <div class="card">
        <h3>⚡ 單曲 Rating 即時計算</h3>
        <div class="calculator-grid">
            <div class="input-group">
                <label for="calc-lv">譜面定數 (Lv)</label>
                <input type="number" id="calc-lv" step="0.1" value="" placeholder="例如: 14.0" min="1" max="15.0">
            </div>
            <div class="input-group">
                <label for="calc-achieve">達成率 (%)</label>
                <input type="number" id="calc-achieve" step="0.0001" value="" placeholder="例如: 100.5000" min="0" max="101.0000">
            </div>
            <div class="result-box">
                <div style="font-size:12px; color:#666;">獲得 Rating</div>
                <div class="val" id="calc-result">-</div>
                <div style="font-size:12px; color:#888;" id="calc-rank">Rank: -</div>
            </div>
        </div>
    </div>

    <!-- 對照表卡片 -->
    <div class="card">
        <div class="table-controls">
            <!-- 點擊觸發 Modal 的按鈕 -->
            <div class="control-item">
                <label><b>基底等級 (Lv)：</b></label>
                <div class="select-trigger" id="base-lv-btn">14</div>
            </div>

            <div class="control-item">
                <label for="target-score"><b>底分 (目標 Rating)：</b></label>
                <input type="number" id="target-score" step="1" value="" placeholder="請輸入" style="width: 90px;">
            </div>

            <div class="control-item">
                <label for="target-achieve"><b>達成率 (%)：</b></label>
                <input type="text" id="target-achieve" inputmode="decimal" value="" placeholder="選填" style="width: 100px;">
            </div>

            <!-- 圖例說明 -->
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-box" style="background: var(--color-gt);"></div>
                    <span>&gt; 底分</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box" style="background: var(--color-eq);"></div>
                    <span>= 底分</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box" style="background: var(--color-lt);"></div>
                    <span>&lt; 底分</span>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table id="rating-table">
                <thead>
                    <tr id="header-row-1">
                        <th rowspan="2">Rank</th>
                        <th rowspan="2">ボーダー<br>達成率</th>
                        <th colspan="11">Lv.</th>
                        <th rowspan="2">ボーダー<br>達成率</th>
                        <th rowspan="2">評価<br>係数</th>
                    </tr>
                    <tr id="header-row-2">
                    </tr>
                </thead>
                <tbody id="table-body">
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- 跳出式對話框 Modal -->
<div class="modal-overlay" id="base-lv-modal">
    <div class="modal-content">
        <div class="modal-header">選擇基底等級 (Lv)</div>
        <div class="modal-body" id="modal-options-list">
            <!-- 倒數選單 (15 ~ 1) JS 動態生成 -->
        </div>
        <div class="modal-cancel" id="modal-cancel-btn">取消</div>
    </div>
</div>

<script>
    let currentBaseLv = 14;

    const ratingRules = [
        { rank: 'SSS+', border: 1.005,    coeff: 22.4, rowspan: 1 },
        { rank: 'SSS',  border: 1.004999, coeff: 22.2, rowspan: 2 },
        { rank: null,   border: 1.000000, coeff: 21.6, rowspan: 0 },
        { rank: 'SS+',  border: 0.999999, coeff: 21.4, rowspan: 2 },
        { rank: null,   border: 0.995000, coeff: 21.1, rowspan: 0 },
        { rank: 'SS',   border: 0.990000, coeff: 20.8, rowspan: 1 },
        { rank: 'S+',   border: 0.989999, coeff: 20.6, rowspan: 2 },
        { rank: null,   border: 0.980000, coeff: 20.3, rowspan: 0 },
        { rank: 'S',    border: 0.970000, coeff: 20.0, rowspan: 1 },
        { rank: 'AAA',  border: 0.969999, coeff: 17.6, rowspan: 2 },
        { rank: null,   border: 0.940000, coeff: 16.8, rowspan: 0 },
        { rank: 'AA',   border: 0.939999, coeff: 16.0, rowspan: 2 },
        { rank: null,   border: 0.900000, coeff: 15.2, rowspan: 0 },
        { rank: 'A',    border: 0.899999, coeff: 14.4, rowspan: 2 },
        { rank: null,   border: 0.800000, coeff: 13.6, rowspan: 0 },
        { rank: 'BBB',  border: 0.750000, coeff: 12.0, rowspan: 1 },
        { rank: 'BB',   border: 0.700000, coeff: 11.2, rowspan: 1 },
        { rank: 'B',    border: 0.600000, coeff: 9.6,  rowspan: 1 },
        { rank: 'C',    border: 0.500000, coeff: 8.0,  rowspan: 1 }
    ];

    function formatPercentage(value) {
        return (value * 100).toFixed(4) + '%';
    }

    function calculateRating(lv, achieveRatio) {
        let matchedRule = ratingRules[ratingRules.length - 1];
        for (let rule of ratingRules) {
            if (achieveRatio >= rule.border) {
                matchedRule = rule;
                break;
            }
        }
        const rating = Math.round(lv * matchedRule.coeff * matchedRule.border);
        
        let rankText = matchedRule.rank;
        if (!rankText) {
            for (let rule of ratingRules) {
                if (achieveRatio >= rule.border && rule.rank) {
                    rankText = rule.rank;
                    break;
                }
            }
        }
        return { rating, rank: rankText || 'D' };
    }

    function updateCalculator() {
        const lvVal = document.getElementById('calc-lv').value.trim();
        const achieveVal = document.getElementById('calc-achieve').value.trim();

        if (lvVal === '' || achieveVal === '') {
            document.getElementById('calc-result').innerText = '-';
            document.getElementById('calc-rank').innerText = 'Rank: -';
            return;
        }

        const lv = parseFloat(lvVal);
        const achieve = parseFloat(achieveVal);
        const ratio = achieve / 100.0;

        if (isNaN(lv) || isNaN(achieve)) {
            document.getElementById('calc-result').innerText = '-';
            document.getElementById('calc-rank').innerText = 'Rank: -';
            return;
        }

        const result = calculateRating(lv, ratio);
        document.getElementById('calc-result').innerText = result.rating;
        document.getElementById('calc-rank').innerText = `Rank: ${result.rank}`;
    }

    function getMatchedRuleIndex(achieveRatio) {
        for (let i = 0; i < ratingRules.length; i++) {
            if (achieveRatio >= ratingRules[i].border) {
                return i;
            }
        }
        return ratingRules.length - 1;
    }

    function handleTargetAchieveInput() {
        const inputEl = document.getElementById('target-achieve');
        let val = inputEl.value;

        val = val.replace(/[^0-9.]/g, '');
        const dotParts = val.split('.');
        if (dotParts.length > 2) {
            val = dotParts[0] + '.' + dotParts.slice(1).join('');
        }

        if (val.includes('.')) {
            const parts = val.split('.');
            if (parts[1].length > 4) {
                val = parts[0] + '.' + parts[1].slice(0, 4);
            }
        }

        let num = parseFloat(val);
        if (!isNaN(num) && num > 100.5) {
            val = '100.5';
        }

        inputEl.value = val;
        renderTable();
    }

    // 初始化 Modal 彈窗選單 (倒數 15 ~ 1)
    function initModalSelect() {
        const btn = document.getElementById('base-lv-btn');
        const modal = document.getElementById('base-lv-modal');
        const list = document.getElementById('modal-options-list');
        const cancelBtn = document.getElementById('modal-cancel-btn');

        // 生成倒數 15 到 1 的選項
        let html = '';
        for (let i = 15; i >= 1; i--) {
            html += `<div class="modal-option" data-value="${i}">${i}</div>`;
        }
        list.innerHTML = html;

        const openModal = () => modal.classList.add('active');
        const closeModal = () => modal.classList.remove('active');

        btn.addEventListener('click', openModal);
        cancelBtn.addEventListener('click', closeModal);

        // 點擊蒙版區域自動關閉
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // 選擇項目
        list.addEventListener('click', (e) => {
            const opt = e.target.closest('.modal-option');
            if (opt) {
                currentBaseLv = parseInt(opt.getAttribute('data-value'), 10);
                btn.innerText = currentBaseLv;
                closeModal();
                renderTable();
            }
        });
    }

    function renderTable() {
        let baseLv = currentBaseLv;

        const targetScoreVal = document.getElementById('target-score').value.trim();
        const targetScore = targetScoreVal === '' ? null : parseInt(targetScoreVal, 10);

        const targetAchieveVal = document.getElementById('target-achieve').value.trim();
        const targetAchieveNum = targetAchieveVal === '' ? null : parseFloat(targetAchieveVal);
        
        let highlightIndex = null;
        if (targetAchieveNum !== null && !isNaN(targetAchieveNum)) {
            highlightIndex = getMatchedRuleIndex(targetAchieveNum / 100.0);
        }

        const headerRow2 = document.getElementById('header-row-2');
        const tbody = document.getElementById('table-body');

        const levels = [];
        for (let i = 0; i < 11; i++) {
            levels.push(Math.round((baseLv + i * 0.1) * 10) / 10);
        }

        headerRow2.innerHTML = levels.map(l => `<th>${l.toFixed(1)}</th>`).join('');

        tbody.innerHTML = ratingRules.map((rule, idx) => {
            const isRowHighlight = (idx === highlightIndex);

            const cells = levels.map(lv => {
                const r = Math.round(lv * rule.coeff * rule.border);
                
                let colorClass = '';
                if (targetScore !== null && !isNaN(targetScore)) {
                    if (r > targetScore) {
                        colorClass = 'cell-gt';
                    } else if (r === targetScore) {
                        colorClass = 'cell-eq';
                    } else {
                        colorClass = 'cell-lt';
                    }
                }

                const hlClass = isRowHighlight ? 'hl-cell' : '';

                return `<td class="rating-val ${colorClass} ${hlClass}">${r}</td>`;
            }).join('');

            let rankTd = '';
            if (rule.rowspan > 0) {
                rankTd = `<td rowspan="${rule.rowspan}" class="rank-cell">${rule.rank}</td>`;
            }

            const pctDisplay = formatPercentage(rule.border);
            const hlClass = isRowHighlight ? 'hl-cell' : '';
            const hlFirstClass = isRowHighlight ? 'hl-cell-first' : '';
            const hlLastClass = isRowHighlight ? 'hl-cell-last' : '';

            return `
                <tr>
                    ${rankTd}
                    <td class="${hlClass} ${hlFirstClass}">${pctDisplay}</td>
                    ${cells}
                    <td class="${hlClass}">${pctDisplay}</td>
                    <td class="${hlClass} ${hlLastClass}">${rule.coeff}</td>
                </tr>
            `;
        }).join('');
    }

    document.getElementById('calc-lv').addEventListener('input', updateCalculator);
    document.getElementById('calc-achieve').addEventListener('input', updateCalculator);

    document.getElementById('target-score').addEventListener('input', renderTable);
    document.getElementById('target-achieve').addEventListener('input', handleTargetAchieveInput);

    // 初始化 Modal 彈窗與數據
    initModalSelect();
    renderTable();
    updateCalculator();
</script>

</body>
</html>
